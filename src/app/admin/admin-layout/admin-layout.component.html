<mat-toolbar class="toolbar-user">
  <button mat-button color="primary" style="margin-right: 10px" (click)="sidenav.toggle()">
    <mat-icon *ngIf="!opened">menu</mat-icon>
    <mat-icon *ngIf="opened">clear</mat-icon>
  </button>
  <span>{{ title }}</span>
  <span class="example-spacer"></span>

  <div class="divInfo">
    <span *ngIf="authService.getRole() === 'COMMERCANT'"> SOLDE <b><i>{{ solde | currency:'XOF':'symbol':'1.0-3': 'fr'}}</i></b></span>
    <span> {{ user!.username}}</span>
    <button mat-button [matMenuTriggerFor]="menu">
      <img src="assets/icon/user.png" style="width: 24px; height: 24px" alt="avatar">
      {{ authService.getRole()}} <mat-icon>expand_more</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="onUpdateProfil()">
        <mat-icon>perm_identity</mat-icon> Profil
      </button>
      <button mat-menu-item (click)="changePasse()">
        <mat-icon>update</mat-icon> Changer Mot de passe
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>subdirectory_arrow_right</mat-icon> Deconnexion
      </button>
    </mat-menu>
  </div>
</mat-toolbar>

<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav mode="side" [class.mat-elevation-z4]="true" class="app-sidenav">
    <mat-nav-list *ngFor="let nav of navList">
      <mat-nav-list>
        <a mat-list-item *ngIf="!nav.items" [routerLink]="nav.routerLink" routerLinkActive="active">
          <img src="assets/icon/{{nav.icon}}" alt="{{nav.icon}}">
          <span>{{nav.label}}</span>
        </a>
      </mat-nav-list>

</mat-sidenav-container>
