<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav mode="side" [class.mat-elevation-z4]="true" class="app-sidenav">
    <mat-nav-list *ngFor="let nav of navList">
      <mat-list-item *ngIf="!nav.items" [routerLink]="nav.routerLink">
        <mat-icon>{{ nav.icon}}</mat-icon><span>{{nav.label}}</span>
      </mat-list-item>
      <mat-expansion-panel *ngIf="nav.items" [class.mat-elevation-z0]="true">
        <mat-expansion-panel-header>
          <mat-icon>{{ nav.icon}}</mat-icon><span>{{nav.label}}</span>
        </mat-expansion-panel-header>
        <mat-nav-list  *ngFor="let subMenu of nav.items">
          <a mat-list-item [routerLink]="subMenu.routerLink">
            <mat-icon>{{subMenu.icon}}</mat-icon><span>{{subMenu.label}}</span>
          </a>
        </mat-nav-list>
      </mat-expansion-panel>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="app-sidenav-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
