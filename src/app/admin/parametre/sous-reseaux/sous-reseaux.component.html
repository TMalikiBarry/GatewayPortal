<div class="containerTable">
  <div style="margin-top: 10px;">
    <button class="btnAdd blue-border" (click)="add()" mat-stroked-button color="primary" >
      <mat-icon>add_circle_outline</mat-icon>
      Ajouter un Sous-Réseau
    </button>

    <mat-form-field appearance="fill">
      <mat-label>Recherche</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Filtrer le reseau" #input>
    </mat-form-field>

    <div class="mat-elevation-z8">
      <table mat-table
             [dataSource]="dataSource" multiTemplateDataRows
             class="mat-elevation-z1" matSort>

        <!-- NOM Column -->
        <ng-container matColumnDef="sousReseauName">
          <th *matHeaderCellDef mat-header-cell mat-sort-header> Nom </th>
          <td *matCellDef="let row" mat-cell> {{row.sousReseauName}} </td>
        </ng-container>

        <!-- CODE Column -->
        <ng-container matColumnDef="code">
          <th *matHeaderCellDef mat-header-cell mat-sort-header> Code </th>
          <td *matCellDef="let row" mat-cell> {{row.code}} </td>
        </ng-container>

        <!-- ACCES Column -->
        <ng-container matColumnDef="acces">
          <th *matHeaderCellDef mat-header-cell mat-sort-header> Superviseur </th>
          <td *matCellDef="let row" mat-cell> {{row.acces.name}} </td>
        </ng-container>

        <!-- RESEAU Column -->
        <ng-container matColumnDef="reseau">
          <th *matHeaderCellDef mat-header-cell mat-sort-header> Nom du réseau</th>
          <td *matCellDef="let row" mat-cell> {{ row.reseau.name }} </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef aria-label="row actions1"> Action</th>
          <td mat-cell *matCellDef="let element">
            <div class="element-action">
              <button mat-icon-button #tooltip="matTooltip"
                      color="primary"
                      matTooltip="Modifier"
                      matTooltipPosition="left"
                      (click)="update(element)">
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button #tooltip="matTooltip"
                color="warn"
                matTooltip="Supprimer"
                matTooltipPosition="after"
                (click)="delete(element)">
                <mat-icon>delete</mat-icon>
              </button>
            </div> </td>
        </ng-container>

        <ng-container matColumnDef="expand">
          <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button aria-label="expand row" (click)="(expandedElement = expandedElement === element ? null : element); $event.stopPropagation()">
              <mat-icon *ngIf="expandedElement !== element">keyboard_arrow_down</mat-icon>
              <mat-icon *ngIf="expandedElement === element">keyboard_arrow_up</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
        <ng-container matColumnDef="expandedDetail">
          <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplayWithExpand.length">
            <div class="example-element-detail"
                 [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
              <table>
                <tr>
                  <th mat-header-cell>Libellé Sous Compte</th>
                </tr>
                <tbody>
                  <tr *ngFor="let scompte of element.scomptes">
                    <td>{{scompte.sousCompteName}}</td>
                  </tr>
                  <tr class="mat-row" *ngIf="element.scomptes.length===0 || !element.scomptes">
                    <td class="mat-cell" colspan="5"><em>Aucun Sous-Compte</em></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"></tr>
        <tr mat-row *matRowDef="let element; columns: columnsToDisplayWithExpand;"
            class="example-element-row"
            [class.example-expanded-row]="expandedElement === element"
            (click)="expandedElement = expandedElement === element ? null : element">
        </tr>
        <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
        <tr *matNoDataRow class="mat-row">
          <td class="mat-cell" colspan="5" *ngIf="input.value">Aucune recherche correspondant à "{{input.value}}"</td>
          <td class="mat-cell" colspan="5" *ngIf="!input.value">Vous n'avez aucun sous-réseau dans votre espace</td>
        </tr>
      </table>

      <mat-paginator showFirstLastButtons [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
  </div>
</div>
